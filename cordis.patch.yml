# dsh-dr-panda-mcp — carrier bundle patch
#
# Two loader rows:
# 1. `drpanda-mcp-plugin` → host half (lib/index.js): settings UI routes,
#    credentials sync, doctor tool, and the `drpandaBridge` service.
# 2. `drpanda-mcp-bridge` → official in-box `@deepseek-ai/dsh-mcp-client`.
#
# Secrets and URL hot-reload go through DSH credentials + expandTemplates:
#   DR_PANDA_MCP_URL    (synced from the plugin page / defaults)
#   DR_PANDA_MCP_TOKEN  (set on the plugin page; env works as fallback)
#
# Primary UX: open the plugin page (or Settings → DrPanda MCP) and save.
# Env vars remain supported for CI / headless profiles.
#
- insert:
    - id: drpanda-mcp-plugin
      name: dsh-dr-panda-mcp

    - id: drpanda-mcp-bridge
      name: "@deepseek-ai/dsh-mcp-client"
      inject: [drpandaBridge]
      config:
        serverName: !!js ctx.drpandaBridge.serverName
        transport: streamable-http
        url: "${credential:DR_PANDA_MCP_URL}"
        expandTemplates: true
        headers:
          Authorization: "Bearer ${credential:DR_PANDA_MCP_TOKEN}"
        toolCallTimeoutMs: !!js ctx.drpandaBridge.toolCallTimeoutMs
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 20
