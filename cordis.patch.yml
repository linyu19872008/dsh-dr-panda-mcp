# dsh-dr-panda-mcp — carrier bundle patch
#
# Two loader rows:
# 1. `drpanda-mcp-plugin` → this package's host half (lib/index.js).
#    Registers one diagnostic tool: `drpanda_mcp_doctor`.
# 2. `drpanda-mcp-bridge` → the OFFICIAL in-box MCP client bridge
#    (`@deepseek-ai/dsh-mcp-client`). Third-party plugins must NOT import it;
#    the DSH loader resolves it from the Desktop / CLI install.
#
# Every tool the bridge registers appears as `mcp__drpanda__*`.
#
# Configure the running DrPanda service with environment variables (do not
# commit tokens into any patch file):
#
#   DR_PANDA_MCP_URL     default http://127.0.0.1:8111/mcp
#   DR_PANDA_MCP_TOKEN   Bearer token from the DrPanda web console ("My account")
#   DR_PANDA_MCP_SERVER  MCP namespace (default drpanda)
#
# Override this bridge row from your profile patch if needed:
#
#   - id: drpanda-mcp-bridge
#     config:
#       url: 'https://mcp.example.com/mcp'
#       headers:
#         Authorization: 'Bearer …'
#       toolCallTimeoutMs: 180000
#
- insert:
    - id: drpanda-mcp-plugin
      name: dsh-dr-panda-mcp

    - id: drpanda-mcp-bridge
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        # Namespace for every tool name: mcp__drpanda__mysql_query, …
        serverName: !!js process.env.DR_PANDA_MCP_SERVER || "drpanda"
        transport: streamable-http
        url: !!js process.env.DR_PANDA_MCP_URL || "http://127.0.0.1:8111/mcp"
        headers:
          Authorization: !!js '`Bearer ${process.env.DR_PANDA_MCP_TOKEN || ""}`'
        # Incident queries (CLS, Kafka lag, MySQL EXPLAIN) can exceed 60 s.
        toolCallTimeoutMs: 120000
        # A downed or unconfigured DrPanda must never fail the whole profile.
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 20
